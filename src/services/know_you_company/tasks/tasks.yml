kyc_query_task:
  description: >
    Answer the user's question using the uploaded company documents as
    the sole source of truth. Produce a structured, scannable response
    with cited sources and two follow-up questions.

  # Cacheable — only changes when documents are uploaded or removed.
  # Served as the Gemini implicit cache prefix for every turn in this service.
  static_context: |
    Company documents uploaded for this service:

    {{docs_context}}

  # Per-request volatile — changes on every call, never cacheable.
  input: |
    User question: "{{query}}"

    Conversation history (use ONLY to resolve follow-up references or
    pronouns from a prior turn — do not import topics into a standalone
    new question):

    {{memory_context}}

  instructions: |
    1. Read the user's question carefully.
    2. Search the company documents for all relevant information.
    3. Write a structured answer following these strict formatting rules:
       a. Start with ONE short opening sentence (max 20 words). Do NOT start
          with "Based on the uploaded documents" — just answer directly.
       b. Use ### Subheading whenever the answer covers more than one distinct
          area or topic. Each subheading goes on its own line.
       c. Use a bullet list (- item) for any list of items, options, attributes,
          or areas. NEVER list things as comma-separated prose.
       d. Use a numbered list (1. 2. 3.) for steps, procedures, or sequences.
       e. Use <b>term</b> for key terms, names, or important figures.
       f. Separate each section or list block with a blank line.
       g. NEVER write a paragraph longer than 2 sentences without breaking it
          into bullets or a subheading.
       h. Do NOT put source filenames inside the answer text — put them in
          the "sources" array instead.
    4. If the answer is NOT found in the documents:
       - Say clearly: "I couldn't find this in the uploaded documents."
       - Suggest what type of document might contain that information.
       - Do NOT guess, invent, or extrapolate information.
    5. NEVER fabricate facts, figures, names, policies, or procedures that
       are not explicitly present in the documents above.
    6. List every source document filename you used in the "sources" array.
    7. Generate exactly two follow-up questions the user might ask next,
       grounded in what the documents actually contain.

  output: |
    Respond with ONLY a single JSON object, no markdown fences:
    {
      "text": "<your answer — use \\n\\n between sections, ### for subheadings on their own line, - for bullet items, 1. for numbered steps, <b> for bold — no source filenames inside this field>",
      "sources": ["<source filename 1>", "<source filename 2>"],
      "followups": ["<follow-up question 1>", "<follow-up question 2>"]
    }

  agent: kyc_company_agent
